name: Build iOS App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest # 🍎 الفرق الوحيد: الأيفون يحتاج ماك

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. إعداد فلاتر على القناة المستقرة (مثل الأندرويد تماماً)
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable' # ✅ بناءً على طلبك
          cache: true

      # 2. كاش لمكتبات Dart (نسخة طبق الأصل من ملف الأندرويد)
      - name: Cache Pub packages
        uses: actions/cache@v4
        with:
          path: ${{ env.PUB_CACHE }}
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      # 3. كاش لـ CocoaPods (المكافئ لـ Gradle في الأندرويد لتسريع البناء)
      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      # 4. التنظيف الشامل وحذف ملف القفل (نفس المنطق الذي نجح معك في الأندرويد)
      - name: Clean and Get Packages
        run: |
          echo "Removing corrupted pubspec.lock..."
          rm -f pubspec.lock
          rm -f ios/Podfile.lock
          flutter clean
          flutter pub get

      - name: Generate App Icons
        run: flutter pub run flutter_launcher_icons

      # 5. تثبيت مكتبات الأيفون (خطوة إضافية ضرورية لـ iOS)
      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update
          cd ..

      # 6. إعداد ملف إعدادات فايربيس
      # ⚠️ تأكد من إضافة GOOGLE_SERVICE_INFO_PLIST_BASE64 في أسرار Github
      - name: Create Firebase Config
        env:
          GOOGLE_PLIST_DATA: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: |
          if [ -n "$GOOGLE_PLIST_DATA" ]; then
            echo "$GOOGLE_PLIST_DATA" | base64 --decode > ios/Runner/GoogleService-Info.plist
          fi

      # 7. بناء التطبيق (بدون توقيع لتجنب مشاكل الشهادات حالياً)
      - name: Build iOS App (No Codesign)
        env:
          APP_SECRET: ${{ secrets.APP_SECRET }}
        run: |
          flutter build ios --release --no-codesign --dart-define=APP_SECRET="$APP_SECRET"

      # 8. رفع الملف الناتج
      - name: Upload iOS App
        uses: actions/upload-artifact@v4
        with:
          name: app-release-ios
          path: build/ios/iphoneos/Runner.app
