name: Build iOS App (Appetize Fixed Final)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Cache Pub packages
        uses: actions/cache@v4
        with:
          path: ${{ env.PUB_CACHE }}
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pub-

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: ${{ runner.os }}-pods-

      - name: Clean and Install
        run: |
          rm -f pubspec.lock
          rm -f ios/Podfile.lock
          flutter clean
          flutter pub get

      # ✅ 4. توليد الأيقونات
      - name: Generate App Icons
        run: flutter pub run flutter_launcher_icons

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update
          cd ..

      # 5. إعداد ملف فايربيس
      - name: Create Firebase Config
        env:
          GOOGLE_PLIST_DATA: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: |
          if [ -n "$GOOGLE_PLIST_DATA" ]; then
            echo "$GOOGLE_PLIST_DATA" | base64 --decode > ios/Runner/GoogleService-Info.plist
          fi

      # 6. البناء والتوقيع اليدوي
      - name: Build & Sign for Simulator
        env:
          APP_SECRET: ${{ secrets.APP_SECRET }}
        run: |
          # بناء نسخة Debug للمحاكي
          flutter build ios --simulator --debug --no-codesign --dart-define=APP_SECRET="$APP_SECRET"
          
          # توقيع المكتبات الداخلية (يحل مشكلة Ass.framework error)
          echo "Signing frameworks..."
          find build/ios/iphonesimulator/Runner.app/Frameworks -name "*.framework" -type d -exec codesign --force --sign - {} \;
          
          # ✅ التعديل هنا: توقيع التطبيق بدون استخدام ملف entitlements مفقود
          # نستخدم --deep للتأكد من توقيع كل المحتويات
          echo "Signing app bundle..."
          codesign --force --deep --sign - build/ios/iphonesimulator/Runner.app

      # 7. الضغط اليدوي الصحيح
      - name: Compress for Appetize
        run: |
          cd build/ios/iphonesimulator
          # استخدام -y للحفاظ على الروابط الرمزية
          zip -r -y -9 Medaad_Appetize.zip Runner.app

      # 8. رفع الملف
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Medaad-iOS-Appetize
          path: build/ios/iphonesimulator/Medaad_Appetize.zip
