name: Build iOS .app (No Signing)

on:
  workflow_dispatch: # تشغيل يدوي

jobs:
  build-unsigned-app:
    name: Build Unsigned iOS App
    runs-on: macos-latest

    steps:
      # 1. سحب الكود
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. إعداد Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.27.1'
          cache: true

      # 3. تثبيت الحزم (مع حل مشكلة pubspec.lock التالف)
      - name: Install Dependencies
        run: |
          echo "Removing corrupted pubspec.lock..."
          rm -f pubspec.lock
          echo "Running flutter pub get..."
          flutter pub get

      # 4. تثبيت مكتبات iOS
      - name: Install Pods
        run: |
          cd ios
          pod install --repo-update
          cd ..

      # 5. بناء التطبيق (بدون توقيع)
      - name: Build iOS App (No Codesign)
        run: |
          flutter build ios --release --no-codesign

      # 6. ضغط ملف .app
      - name: Compress .app
        run: |
          cd build/ios/iphoneos
          tar -czf medaad_app_unsigned.tar.gz Runner.app

      # 7. رفع الملف الناتج (تم تصحيح المسار)
      - name: Upload .app Artifact
        uses: actions/upload-artifact@v4
        with:
          name: medaad-ios-app-unsigned
          # تم تعديل المسار ليعمل من الجذر مباشرة
          path: build/ios/iphoneos/medaad_app_unsigned.tar.gz
