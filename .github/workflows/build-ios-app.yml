name: Build iOS App (Fixed Firebase)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Cache Pub packages
        uses: actions/cache@v4
        with:
          path: ${{ env.PUB_CACHE }}
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pub-

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: ${{ runner.os }}-pods-

      - name: Clean and Install
        run: |
          rm -f pubspec.lock
          rm -f ios/Podfile.lock
          flutter clean
          flutter pub get

      - name: Generate App Icons
        run: flutter pub run flutter_launcher_icons

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update
          cd ..

      # 5. إنشاء ملف فايربيس من السر
      - name: Create Firebase Config
        env:
          GOOGLE_PLIST_DATA: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: |
          if [ -n "$GOOGLE_PLIST_DATA" ]; then
            echo "$GOOGLE_PLIST_DATA" | base64 --decode > ios/Runner/GoogleService-Info.plist
            echo "✅ GoogleService-Info.plist created successfully."
          else
            echo "❌ Error: GOOGLE_SERVICE_INFO_PLIST_BASE64 secret is missing or empty!"
            exit 1
          fi

      # ✅ 6. خطوة جديدة وحاسمة: ربط الملف بالمشروع برمجياً
      # هذه الخطوة تستخدم مكتبة xcodeproj لإضافة الملف إلى إعدادات المشروع
      - name: Link Firebase Config to Xcode
        run: |
          gem install xcodeproj
          ruby -e '
            require "xcodeproj"
            project_path = "ios/Runner.xcodeproj"
            file_name = "GoogleService-Info.plist"
            project = Xcodeproj::Project.open(project_path)
            
            # البحث عن الملف داخل المشروع
            runner_group = project.main_group.find_subpath(File.join("Runner"), true)
            
            # التحقق مما إذا كان الملف مضافاً بالفعل لتجنب التكرار
            unless runner_group.find_file_by_path(file_name)
              file_ref = runner_group.new_reference(file_name)
              target = project.targets.first # الهدف الأول هو Runner عادة
              target.add_resources([file_ref])
              project.save
              puts "✅ Successfully linked #{file_name} to Xcode project."
            else
              puts "ℹ️ #{file_name} is already linked."
            end
          '

      # 7. البناء والتوقيع اليدوي
      - name: Build & Sign for Simulator
        env:
          APP_SECRET: ${{ secrets.APP_SECRET }}
        run: |
          flutter build ios --simulator --debug --no-codesign --dart-define=APP_SECRET="$APP_SECRET"
          
          echo "Signing frameworks..."
          find build/ios/iphonesimulator/Runner.app/Frameworks -name "*.framework" -type d -exec codesign --force --sign - {} \;
          
          echo "Signing app bundle..."
          codesign --force --deep --sign - build/ios/iphonesimulator/Runner.app

      # 8. الضغط اليدوي
      - name: Compress for Appetize
        run: |
          cd build/ios/iphonesimulator
          zip -r -y -9 Medaad_Appetize_Fixed.zip Runner.app

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Medaad-iOS-Appetize-Fixed
          path: build/ios/iphonesimulator/Medaad_Appetize_Fixed.zip
