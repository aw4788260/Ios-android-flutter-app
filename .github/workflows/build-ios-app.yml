name: Build iOS App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest # 🍎 تغيير ضروري: الأيفون يحتاج ماك

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # ⚠️ الجافا غير مطلوبة للأيفون، تم إزالتها

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # ✅ 1. تسريع تحميل مكتبات Dart (نفس كود الأندرويد)
      - name: Cache Pub packages
        uses: actions/cache@v4
        with:
          path: ${{ env.PUB_CACHE }}
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      # 🍎 2. تسريع تحميل CocoaPods (بديل Gradle في الأندرويد)
      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      # ✅ 3. التنظيف وحل المشاكل (نفس المنطق المطلوب)
      - name: Clean and Get Packages
        run: |
          echo "Removing corrupted pubspec.lock..."
          rm -f pubspec.lock
          flutter clean
          flutter pub get

      - name: Generate App Icons
        run: flutter pub run flutter_launcher_icons

      # 🍎 4. تثبيت مكتبات الأيفون (Pod Install)
      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update
          cd ..

      # 🔐 5. إعداد ملف GoogleService-Info.plist (بديل google-services.json)
      # تأكد من إضافة GOOGLE_SERVICE_INFO_PLIST_BASE64 في أسرار Github
      - name: Create Firebase Config
        env:
          GOOGLE_PLIST_DATA: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: |
          if [ -n "$GOOGLE_PLIST_DATA" ]; then
            echo "$GOOGLE_PLIST_DATA" | base64 --decode > ios/Runner/GoogleService-Info.plist
          fi

      # 🏗️ 6. بناء التطبيق (بدون توقيع لتجنب أخطاء الشهادات في الوقت الحالي)
      - name: Build iOS App (No Codesign)
        env:
          APP_SECRET: ${{ secrets.APP_SECRET }}
        run: |
          flutter build ios --release --no-codesign --dart-define=APP_SECRET="$APP_SECRET"

      # 📤 7. رفع التطبيق الناتج
      - name: Upload iOS App
        uses: actions/upload-artifact@v4
        with:
          name: app-release-ios
          path: build/ios/iphoneos/Runner.app
