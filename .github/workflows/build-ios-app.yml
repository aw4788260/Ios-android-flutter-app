name: Build iOS App (Simulator)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. إعداد فلاتر
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # 2. كاش مكتبات Dart
      - name: Cache Pub packages
        uses: actions/cache@v4
        with:
          path: ${{ env.PUB_CACHE }}
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      # 3. كاش CocoaPods
      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      # 4. تنظيف وتهيئة
      - name: Clean and Get Packages
        run: |
          echo "Removing corrupted pubspec.lock..."
          rm -f pubspec.lock
          rm -f ios/Podfile.lock
          flutter clean
          flutter pub get

      - name: Generate App Icons
        run: flutter pub run flutter_launcher_icons

      # 5. تثبيت مكتبات iOS
      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update
          cd ..

      # 6. إعداد ملف فايربيس
      - name: Create Firebase Config
        env:
          GOOGLE_PLIST_DATA: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: |
          if [ -n "$GOOGLE_PLIST_DATA" ]; then
            echo "$GOOGLE_PLIST_DATA" | base64 --decode > ios/Runner/GoogleService-Info.plist
          fi

      # 7. بناء النسخة المخصصة للمحاكي (Simulator Build)
      # التغيير هنا: استخدمنا --debug بدلاً من --release لأن المحاكي لا يدعم Release
      - name: Build iOS App for Simulator
        env:
          APP_SECRET: ${{ secrets.APP_SECRET }}
        run: |
          flutter build ios --simulator --debug --no-codesign --dart-define=APP_SECRET="$APP_SECRET"

      # 8. رفع الملف الناتج (مجلد Runner.app مضغوط)
      - name: Upload iOS Simulator App
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-build
          path: build/ios/iphonesimulator/Runner.app
